[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
JUST_UNSTABLE = "1"
KUBECONFIG = "{{config_root}}/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[tools]
"python" = "3.14.7"
"uv" = "0.12.7"
"pipx" = "1.17.1"
"aqua:casey/just" = "1.58.0"
"aqua:charmbracelet/gum" = "0.17.0"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cloudflare/cloudflared" = "2026.8.2"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:fluxcd/flux2" = "2.9.5"
"aqua:getsops/sops" = "3.13.3"
"aqua:helm/helm" = "4.2.4"
"aqua:helmfile/helmfile" = "1.7.4"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:kubernetes/kubernetes/kubectl" = "1.37.0"
"aqua:mikefarah/yq" = "4.53.6"
"aqua:siderolabs/talos" = "1.13.9"
doppler = { version = "3.76.5", exe = "doppler" }
