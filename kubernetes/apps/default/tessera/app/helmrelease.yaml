---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tessera
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      tessera:
        containers:
          app:
            image:
              repository: ghcr.io/maxgramser/homeassistant_espscreen
              tag: latest
            env:
              TZ: Europe/Berlin
              SCREEN_DEV: "1"
              HA_API: http://home-assistant.default.svc.cluster.local:8123/api
              HA_TOKEN_FILE: /run/secrets/ha_token
              ESPHOME_CONFIG: /config
              SCREEN_DATA: /data
          # The app only listens on 127.0.0.1:8099, this sidecar forwards pod traffic to it
          proxy:
            image:
              repository: docker.io/alpine/socat
              tag: latest
            args:
              - TCP-LISTEN:8080,fork,reuseaddr
              - TCP:127.0.0.1:8099
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["tessera.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: "${PVC_NAME}"
        advancedMounts:
          tessera:
            app:
              - path: /config
                subPath: esphome
              - path: /data
                subPath: data
      # The app expects the HA token to be provided in a file
      ha-token:
        type: secret
        name: tessera-secret
        defaultMode: 0400
        advancedMounts:
          tessera:
            app:
              - path: /run/secrets/ha_token
                subPath: ha_token
                readOnly: true
    networkpolicies:
      main:
        controller: tessera
        policyTypes:
          - Ingress
        rules:
          ingress:
            - from:
                - namespaceSelector: {}
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: envoy
