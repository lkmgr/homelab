---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tessera
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: volsync
      namespace: volsync-system
  values:
    controllers:
      tessera:
        containers:
          app:
            image:
              repository: ghcr.io/maxgramser/homeassistant_espscreen
              tag: 0.4.100@sha256:f2f679f50b12c854e5b79c941527976481b4017ec8af805454702144a7a1318c
            env:
              TZ: Europe/Berlin
              SCREEN_DEV: "1"
              HA_API: http://home-assistant.default.svc.cluster.local:8123/api
              HA_TOKEN_FILE: /run/secrets/ha_token
              ESPHOME_CONFIG: /config
              SCREEN_DATA: /data
              SCREEN_CAMERA_URL: http://192.168.4.243:8098
          # The web UI only listens on 127.0.0.1:8099, this sidecar forwards pod traffic to it
          proxy:
            image:
              repository: docker.io/alpine/socat
              tag: 1.8.1.3@sha256:c95c67c1b4860a195bb2ea1351cb8388e1ec1bf4636633ccac7e0d19661ed5fe
            args:
              - TCP-LISTEN:8080,fork,reuseaddr
              - TCP:127.0.0.1:8099
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
      camera:
        controller: *app
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: "192.168.4.243"
        ports:
          camera:
            port: 8098
    route:
      app:
        hostnames: ["tessera.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: "${PVC_NAME}"
        advancedMounts:
          tessera:
            app:
              - path: /config
                subPath: esphome
              - path: /data
                subPath: data
      # The app expects the HA token to be provided in a file
      ha-token:
        type: secret
        name: tessera-secret
        defaultMode: 0400
        advancedMounts:
          tessera:
            app:
              - path: /run/secrets/ha_token
                subPath: ha_token
                readOnly: true
