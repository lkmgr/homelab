---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tesserae
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  values:
    controllers:
      tesserae:
        containers:
          app:
            image:
              repository: ghcr.io/dmellok/tesserae
              tag: 0.152.0
            env:
              TZ: Europe/Berlin
              TESSERAE_IN_DOCKER: "1"
              TESSERAE_HOST_IP: &ip "192.168.4.248"
    service:
      app:
        controller: tesserae
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          lbipam.cilium.io/ips: *ip
        ports:
          http:
            port: 8765
    route:
      app:
        hostnames: ["tesserae.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: tesserae-data
        globalMounts:
          - path: /app/data
