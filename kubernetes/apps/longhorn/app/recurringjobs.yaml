---
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: default-snapshot-cleanup
  namespace: longhorn-system
spec:
  cron: "12 1 * * 1"
  task: "snapshot-cleanup"
  groups:
    - default
  retain: 1
  concurrency: 2

---
apiVersion: longhorn.io/v1beta1
kind: RecurringJob
metadata:
  name: default-trim
  namespace: longhorn-system
spec:
  cron: "12 3 * * 1"
  task: "filesystem-trim"
  groups:
    - default
  retain: 1
  concurrency: 2
